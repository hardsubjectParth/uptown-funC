models:
  - id: qwen-local
    provider: ollama
    model: qwen2.5vl:3b
    capabilities: [reasoning, vision, completion, document]
    enabled: true
    tier: balanced
    speed: fast
    quality: good
    quality_rank: 2
    size: 3B
    quantization: Q4_K_M
    context_window: 32768
    memory_gb: 4
    use_for: [general, document_workflow, multimodal]

  # Optional local profiles. Enable only after pulling the matching Ollama model.
  - id: qwen-fast
    provider: ollama
    model: qwen3:4b
    capabilities: [reasoning, completion, document]
    enabled: false
    tier: fast
    speed: very_fast
    quality: good
    quality_rank: 2
    size: 4B
    quantization: Q4_K_M
    context_window: 32768
    memory_gb: 4
    use_for: [general, document_workflow]

  - id: qwen-quality
    provider: ollama
    model: qwen3:14b
    capabilities: [reasoning, completion, document]
    enabled: false
    tier: quality
    speed: medium
    quality: very_good
    quality_rank: 4
    size: 14B
    quantization: Q4_K_M
    context_window: 32768
    memory_gb: 10
    use_for: [general, document_workflow]

  - id: qwen-vision
    provider: ollama
    model: qwen2.5vl:7b
    capabilities: [reasoning, vision, completion, document]
    enabled: false
    tier: multimodal
    speed: medium
    quality: very_good
    quality_rank: 4
    size: 7B
    quantization: Q4_K_M
    context_window: 32768
    memory_gb: 8
    use_for: [multimodal, document_workflow]

  - id: qwen-coder
    provider: ollama
    model: qwen2.5-coder:7b
    capabilities: [reasoning, coding, completion]
    enabled: false
    tier: coding
    speed: medium
    quality: very_good
    quality_rank: 4
    size: 7B
    quantization: Q4_K_M
    context_window: 32768
    memory_gb: 8
    use_for: [coding]

  - id: qwen-reasoning
    provider: ollama
    model: qwen3:30b-a3b
    capabilities: [reasoning, completion, document]
    enabled: false
    tier: reasoning
    speed: slow
    quality: excellent
    quality_rank: 5
    size: 30B-A3B
    quantization: Q4_K_M
    context_window: 32768
    memory_gb: 20
    use_for: [general, document_workflow, coding]

  - id: nomic-embed
    provider: ollama
    model: nomic-embed-text
    capabilities: [embedding]
    enabled: true
    tier: embedding
    speed: fast
    quality: good
    quality_rank: 2
    size: 137M
    quantization: F16
    dimensions: 768
    context_window: 8192
    memory_gb: 1
    use_for: [embedding]

  - id: bge-m3-embed
    provider: ollama
    model: bge-m3
    capabilities: [embedding, multilingual]
    enabled: false
    tier: embedding
    speed: medium
    quality: very_good
    quality_rank: 4
    size: 568M
    quantization: F16
    dimensions: 1024
    context_window: 8192
    memory_gb: 3
    use_for: [embedding, multilingual]

