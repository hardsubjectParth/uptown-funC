# Model registry read by app/models/router.py. `model:` is the Ollama model name.
# Strong set (2026-09): pulled directly from the Ollama library. A missing model
# at call time degrades to `qwen-local` and emits a `model_fallback` event.
models:
  - id: qwen-local
    provider: ollama
    model: qwen3.6:27b
    capabilities: [reasoning, completion, document, coding]
    enabled: true
    tier: balanced
    speed: medium
    quality: excellent
    quality_rank: 5
    size: 27B
    quantization: Q4_K_M
    context_window: 32768
    memory_gb: 17
    use_for: [general, document_workflow, calculation, spreadsheet, presentation, coding]

  # Task-specialised profiles. The router picks one per task type and the
  # orchestrator builds a matching adapter. `ollama pull` each before an
  # air-gapped deployment.
  - id: qwen-fast
    provider: ollama
    model: qwen3.5:4b
    capabilities: [reasoning, completion, document]
    enabled: false
    tier: fast
    speed: very_fast
    quality: good
    quality_rank: 2
    size: 4B
    quantization: Q4_K_M
    context_window: 32768
    memory_gb: 3
    use_for: [general, document_workflow]

  - id: qwen-quality
    provider: ollama
    model: qwen3:14b
    capabilities: [reasoning, completion, document]
    enabled: false
    tier: quality
    speed: medium
    quality: very_good
    quality_rank: 4
    size: 14B
    quantization: Q4_K_M
    context_window: 32768
    memory_gb: 10
    use_for: [general, document_workflow]

  - id: qwen-vision
    provider: ollama
    model: qwen3-vl:8b
    capabilities: [reasoning, vision, completion, document]
    enabled: true
    tier: multimodal
    speed: medium
    quality: excellent
    quality_rank: 5
    size: 8B
    quantization: Q4_K_M
    context_window: 32768
    memory_gb: 6
    use_for: [multimodal, document_workflow]

  # Same model as qwen-local -- Qwen3.6-27B is also the strongest local coder
  # (SWE-bench Verified 77.2), so coding tasks reuse the already-resident
  # model instead of swapping in a dedicated coder.
  - id: qwen-coder
    provider: ollama
    model: qwen3.6:27b
    capabilities: [reasoning, coding, completion]
    enabled: true
    tier: coding
    speed: medium
    quality: excellent
    quality_rank: 5
    size: 27B
    quantization: Q4_K_M
    context_window: 32768
    memory_gb: 17
    use_for: [coding]

  # Dedicated MoE coder, only if qwen-local is deliberately swapped out for it
  # (256K context, faster generation at similar VRAM). Off by default to avoid
  # a second ~19GB model competing for memory with qwen-local.
  - id: qwen-coder-moe
    provider: ollama
    model: qwen3-coder:30b
    capabilities: [reasoning, coding, completion]
    enabled: false
    tier: coding
    speed: fast
    quality: excellent
    quality_rank: 5
    size: 30B-A3B
    quantization: Q4_K_M
    context_window: 262144
    memory_gb: 19
    use_for: [coding]

  - id: qwen-reasoning
    provider: ollama
    model: qwen3.6:35b-a3b
    capabilities: [reasoning, completion, document]
    enabled: false
    tier: reasoning
    speed: fast
    quality: excellent
    quality_rank: 5
    size: 35B-A3B
    quantization: Q4_K_M
    context_window: 262144
    memory_gb: 20
    use_for: [general, document_workflow, coding]

  - id: nomic-embed
    provider: ollama
    model: nomic-embed-text
    capabilities: [embedding]
    enabled: false
    tier: embedding
    speed: fast
    quality: good
    quality_rank: 2
    size: 137M
    quantization: F16
    dimensions: 768
    context_window: 8192
    memory_gb: 1
    use_for: [embedding]

  - id: bge-m3-embed
    provider: ollama
    model: bge-m3
    capabilities: [embedding, multilingual]
    enabled: true
    tier: embedding
    speed: medium
    quality: very_good
    quality_rank: 4
    size: 568M
    quantization: F16
    dimensions: 1024
    context_window: 8192
    memory_gb: 2
    use_for: [embedding, multilingual]
