# llama-swap configuration (EXAMPLE) — maps the model aliases used by the
# orchestrator to on-demand llama.cpp (llama-server) processes.
#
#   Router alias  ->  this file's model key  ->  llama-server + GGUF
#
# Copy to config/llama-swap.yaml, fix the -m / --mmproj paths for the machine,
# then run:
#
#   llama-swap --config config/llama-swap.yaml --listen :8080
#
# The orchestrator then talks to http://localhost:8080/v1 (LLM_BASE_URL).
# Needs a recent llama.cpp build (Qwen3.5 / Qwen3.6 hybrid-MoE support).
# Schema notes are for llama-swap >= v130; verify against your version.

healthCheckTimeout: 300

macros:
  # Edit this once; every model below inherits it. Each model lives in its own
  # subdirectory because every repo names its projector `mmproj-F16.gguf` —
  # a flat directory would collide.
  models_dir: "/Users/CHANGEME/models"
  server: "llama-server --port ${PORT} --host 127.0.0.1"

models:
  # --- always-resident small models (ttl: 0 = never auto-unloaded) ---
  # Reserved for LLM-based task classification / guardrail. Not wired yet.
  router:
    cmd: >
      ${server}
      -m ${models_dir}/qwen3.5-2b/Qwen3.5-2B-Q4_K_M.gguf
      -c 8192 -ngl 99 --jinja
    ttl: 0

  embedder:
    cmd: >
      ${server}
      -m ${models_dir}/qwen3-embedding-0.6b/Qwen3-Embedding-0.6B-Q8_0.gguf
      -c 8192 -ngl 99 --embedding --pooling last
    ttl: 0

  # Second-stage retrieval scoring via llama.cpp's /v1/rerank endpoint.
  #
  # bge-reranker-v2-m3 is a BERT-style cross-encoder, which is what llama.cpp's
  # rerank path expects. Qwen3-Reranker was tried first and scored badly here
  # (see CHANGES.md 4E): it is a causal LM scored on yes/no token logits, and
  # the generic rerank path does not drive it correctly.
  reranker:
    cmd: >
      ${server}
      -m ${models_dir}/bge-reranker-v2-m3/bge-reranker-v2-m3-Q8_0.gguf
      -c 8192 -ngl 99 --reranking --pooling rank
    ttl: 0

  # Kept for reference; scored worse than embeddings alone. Not wired.
  reranker-qwen:
    cmd: >
      ${server}
      -m ${models_dir}/qwen3-reranker-0.6b/Qwen3-Reranker-0.6B.Q8_0.gguf
      -c 8192 -ngl 99 --reranking --pooling rank
    ttl: 300

  # --- heavy models, loaded on demand, evict each other ---
  #
  # MEMORY: Qwen3.6-35B-A3B at UD-Q4_K_M (22.13 GB) does NOT work on a 32 GB M1
  # Max. It loads and answers once, then llama.cpp returns 500 "Compute error"
  # as soon as the embedder loads beside it. Keep total weights + KV cache well
  # under ~22 GB, and keep `-c` modest: context is charged on top of weights and
  # a large `-c` was part of that failure.
  #
  # Two reasoner candidates are defined so they can be compared head to head.
  # `config/model_registry.yaml` decides which one the orchestrator actually
  # uses (its `model_alias`).

  # Dense 9B, natively multimodal. ~6.6 GB total leaves plenty of room for a
  # large context — which matters because retrieved RAG chunks live there.
  reasoner-9b:
    cmd: >
      ${server}
      -m ${models_dir}/qwen3.5-9b/Qwen3.5-9B-Q4_K_M.gguf
      --mmproj ${models_dir}/qwen3.5-9b/mmproj-F16.gguf
      -c 16384 -ngl 99 --jinja
    ttl: 600

  # 35B MoE, only 3B active per token, so faster than a dense model of similar
  # footprint. IQ3_XXS (13.21 GB) is the largest 35B quant with real headroom
  # here; Q3_K_M (16.6 GB) fits far more tightly.
  #
  # -c 16384 measured on a 32 GB M1 Max: a 10,640-token prompt completed with
  # the embedder loaded alongside, peaking at 20.1 GB wired. Raising it further
  # is untested and the practical ceiling is around 22 GB.
  reasoner-35b:
    cmd: >
      ${server}
      -m ${models_dir}/qwen3.6-35b-a3b/Qwen3.6-35B-A3B-UD-IQ3_XXS.gguf
      --mmproj ${models_dir}/qwen3.6-35b-a3b/mmproj-F16.gguf
      -c 16384 -ngl 99 --jinja
    ttl: 600

  # Qwen3.5-4B (natively multimodal) + its vision projector.
  #
  # NOTE: both reasoners above are multimodal too, so this entry is optional.
  # Pointing the registry's ocr tasks at the chosen reasoner means llama-swap
  # never swaps; keeping this 4B is cheaper per OCR call but every alternation
  # between OCR and reasoning pays a model reload.
  vision:
    cmd: >
      ${server}
      -m ${models_dir}/qwen3.5-4b/Qwen3.5-4B-Q4_K_M.gguf
      --mmproj ${models_dir}/qwen3.5-4b/mmproj-F16.gguf
      -c 8192 -ngl 99
    ttl: 600

groups:
  # Small models run together and are never evicted by the heavy group.
  residents:
    swap: false
    exclusive: false
    persistent: true
    members: [router, embedder, reranker]

  # One heavy model at a time; loading one unloads the others, but leaves
  # the residents group untouched (exclusive: false).
  heavy:
    swap: true
    exclusive: false
    members: [reasoner-9b, reasoner-35b, vision]
