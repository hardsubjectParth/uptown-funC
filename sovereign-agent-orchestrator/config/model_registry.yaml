# model_registry.yaml — read by the Router; drives which alias gets
# requested from llama-swap's OpenAI-compatible endpoint.
#
# `model_alias` must match a model name in llama-swap.yaml (see
# config/llama-swap.example.yaml). `task_types` is the Router's decision table:
# a classified task type is matched against these lists.
#
# `always_resident` / `min_free_gpu_gb` are hints for the llama-swap config
# (groups / TTL); they are not yet enforced by the Router at runtime.
#
# Lineup (Sept 2026): Qwen3.5 / Qwen3.6 generation, Qwen3-Embedding/Reranker.
# Qwen3.6-35B-A3B covers reasoning AND coding (no separate coder model).

models:
  - id: router-2b
    hf_model: Qwen/Qwen3.5-2B
    task_types: [classification, guardrail, prompt_injection_check]
    engine: llamacpp
    model_alias: router
    always_resident: true
    min_free_gpu_gb: 3

  - id: embedder-0.6b
    hf_model: Qwen/Qwen3-Embedding-0.6B
    task_types: [embedding]
    engine: llamacpp
    model_alias: embedder
    always_resident: true
    min_free_gpu_gb: 1

  # NOTE: no `rerank` entry. Qwen/Qwen3-Reranker-0.6B-GGUF is gated on HF and
  # no rerank stage exists in the pipeline yet. Add the model to
  # config/llama-swap.yaml at the same time as adding it back here — the router
  # must never return an alias llama-swap does not serve.

  # Chosen by benchmark (see CHANGES.md §4C). Both candidates are defined in
  # config/llama-swap.example.yaml; switch `model_alias` to compare again.
  #
  #   reasoner-35b  Qwen3.6-35B-A3B IQ3_XXS 14.1 GB  MoE, 3B active  <-- IN USE
  #   reasoner-9b   Qwen3.5-9B Q4_K_M        6.6 GB  dense
  #
  # On identical prompts the 35B was ~1.85x faster (37 vs 20 tok/s) AND more
  # accurate: the 9B got a date-arithmetic question wrong in a way that
  # contradicted its own stated method. Q3 quantization did not cancel the MoE
  # advantage. Its one cost is context budget: it runs at -c 8192 vs 16384.
  #
  # Qwen3.6-35B-A3B at Q4 (22.13 GB) does NOT fit on a 32 GB M1 Max — llama.cpp
  # returns 500 "Compute error" once the embedder loads alongside it. IQ3_XXS
  # was verified to coexist with the embedder at ~19.5 GB wired.
  - id: reasoner
    hf_model: Qwen/Qwen3.6-35B-A3B
    task_types: [planning, summarization, analysis, approval_note, general,
                 coding, debugging, test_generation]
    engine: llamacpp
    model_alias: reasoner-35b
    always_resident: false
    min_free_gpu_gb: 16

  - id: vision-4b
    hf_model: Qwen/Qwen3.5-4B          # or Qwen/Qwen3.5-9B for higher quality
    task_types: [ocr, drawing_understanding, scanned_document]
    engine: llamacpp
    model_alias: vision
    always_resident: false
    min_free_gpu_gb: 6
