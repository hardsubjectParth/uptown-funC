services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: orchestrator
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator -d orchestrator"]
      interval: 5s
      timeout: 5s
      retries: 20
  orchestrator:
    build: .
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgresql+psycopg://orchestrator:change-me@postgres:5432/orchestrator
      MODEL_MODE: fake
      API_KEY: change-me-in-production
      # For llamaswap mode, run llama-swap on the host and point this at it,
      # e.g. http://host.docker.internal:8080/v1
      LLM_BASE_URL: http://host.docker.internal:8080/v1
      EMBEDDING_MODEL_ALIAS: embedder
      VISION_MODEL_ALIAS: vision
    volumes:
      - ./workspace:/app/workspace
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
